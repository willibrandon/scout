name: Release Gates

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Commit SHA or ref to test. Defaults to the workflow ref.
        required: false
        type: string
      gate:
        description: Gate subset to run.
        required: false
        default: all
        type: choice
        options:
          - all
          - performance

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.gate || 'all' }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LINUX_LIBC_VERSION: "2.36-9+deb12u14"
  LINUX_SNAPSHOT_URL: "http://snapshot.debian.org/archive/debian/20260531T000000Z"

jobs:
  focused-benchmarks:
    name: interval compilation and traversal benchmarks
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore release reference
        run: eng/restore-ripgrep-oracle.sh
      - name: Verify output and measure compilation and traversal
        env:
          SCOUT_TEST_RIPGREP_PATH: ${{ github.workspace }}/artifacts/ripgrep-oracle/osx-arm64/ripgrep/target/release-lto/rg
        run: |
          mkdir -p artifacts/bench/upstream
          git rev-parse HEAD > artifacts/bench/upstream/commit.txt
          dotnet run --project bench/Scout.Benchmarks/Scout.Benchmarks.csproj -c Release -- \
            --filter '*Upstream*' --job short --buildTimeout 600 --exporters json --artifacts artifacts/bench/upstream \
            | tee artifacts/bench/upstream/run.log
          python3 eng/verify-upstream-benchmarks.py artifacts/bench/upstream
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-benchmarks
          path: artifacts/bench/upstream

  library-packages:
    name: package consumers (${{ matrix.rid }})
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: osx-x64, runner: macos-26-intel }
          - { rid: osx-arm64, runner: macos-26 }
          - { rid: win-x64, runner: windows-2025-vs2026, vsarch: x64 }
          - { rid: win-arm64, runner: windows-11-arm, vsarch: arm64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Use the Windows build drive for NuGet caches
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: eng/setup-windows-nuget-cache.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: eng/install-linux-host-prereqs.sh
      - name: Execute JIT, trimmed, and AOT NuGet consumers
        if: runner.os != 'Windows'
        run: python3 eng/verify-library-packages.py --rid ${{ matrix.rid }}
      - name: Execute Windows JIT, trimmed, and AOT NuGet consumers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio installation not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.vsarch }}
          python eng/verify-library-packages.py --rid ${{ matrix.rid }}
      - name: Upload package consumer receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-consumers-${{ matrix.rid }}
          path: artifacts/package-consumers/${{ matrix.rid }}

  linux-musl-arm64:
    name: Alpine ARM64 native and package gates
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Build, execute, and package on musl ARM64
        run: |
          docker run --rm -v "$PWD:/scout" -w /scout \
            -e GITHUB_ACTIONS=true \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine3.22-arm64v8 \
            sh -c 'apk add --no-cache bash && bash eng/run-musl-gates.sh'
      - name: Upload musl validation receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: musl-arm64-gates
          path: |
            artifacts/prereqs/linux-musl-arm64
            artifacts/package-consumers/linux-musl-arm64/results.json

  full-tests-linux:
    name: full pinned Linux tests
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    container:
      image: docker.io/library/debian:bookworm-slim@sha256:0104b334637a5f19aa9c983a91b54c89887c0984081f2068983107a6f6c21eeb
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Pinned snapshot apt prerequisites
        shell: sh
        run: |
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          printf 'deb %s bookworm main\n' "$LINUX_SNAPSHOT_URL" > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until false;\nAcquire::Retries 3;\n' > /etc/apt/apt.conf.d/99snapshot
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            binutils \
            brotli \
            build-essential \
            bzip2 \
            ca-certificates \
            clang \
            curl \
            fish \
            zsh \
            git \
            gzip \
            libc6="$LINUX_LIBC_VERSION" \
            libc-bin="$LINUX_LIBC_VERSION" \
            libgssapi-krb5-2 \
            libicu72 \
            libssl3 \
            lz4 \
            ncompress \
            pkg-config \
            python3 \
            tar \
            unzip \
            xz-utils \
            zlib1g \
            zlib1g-dev \
            zstd
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify Linux prerequisites
        shell: sh
        run: eng/verify-linux-prereqs.sh ${{ matrix.rid }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Set up verified validation SDK and runtimes
        shell: bash
        run: python3 eng/setup-dotnet-validation.py --rid ${{ matrix.rid }}
      - name: Restore pinned ripgrep oracle archive
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/restore-ripgrep-oracle.sh
      - name: Restore
        run: dotnet restore Scout.slnx
      - name: Fetch pinned corpora
        run: eng/fetch-corpora.sh --all
      - name: Preflight
        timeout-minutes: 30
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/preflight.sh
      - name: Test
        run: dotnet test Scout.slnx --no-restore
      - name: Native pinned differentials
        run: native/build-app-unix.sh ${{ matrix.rid }} --with-differentials
      - name: Run complete native CLI differential suite
        env:
          SCOUT_TEST_EXECUTABLE_PATH: ${{ github.workspace }}/artifacts/bin/${{ matrix.rid }}/scout
        run: dotnet test tests/Scout.Differential.Tests/Scout.Differential.Tests.csproj --no-restore
      - name: Verify Unix shell completions
        shell: bash
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew list fish >/dev/null 2>&1 || brew install fish; fi
          python3 eng/verify-completions.py --scout artifacts/bin/${{ matrix.rid }}/scout --shell bash --shell zsh --shell fish

  full-tests-macos:
    name: full pinned macOS tests
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            runner: macos-26-intel
          - rid: osx-arm64
            runner: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Set up verified validation SDK and runtimes
        shell: bash
        run: python3 eng/setup-dotnet-validation.py --rid ${{ matrix.rid }}
      - name: Restore pinned ripgrep oracle archive
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/restore-ripgrep-oracle.sh
      - name: Restore
        run: dotnet restore Scout.slnx
      - name: Fetch pinned corpora
        run: eng/fetch-corpora.sh --all
      - name: Preflight
        timeout-minutes: 30
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/preflight.sh
      - name: Test
        run: dotnet test Scout.slnx --no-restore
      - name: Native pinned differentials
        run: native/build-app-unix.sh ${{ matrix.rid }} --with-differentials
      - name: Run complete native CLI differential suite
        env:
          SCOUT_TEST_EXECUTABLE_PATH: ${{ github.workspace }}/artifacts/bin/${{ matrix.rid }}/scout
        run: dotnet test tests/Scout.Differential.Tests/Scout.Differential.Tests.csproj --no-restore
      - name: Verify Unix shell completions
        shell: bash
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew list fish >/dev/null 2>&1 || brew install fish; fi
          python3 eng/verify-completions.py --scout artifacts/bin/${{ matrix.rid }}/scout --shell bash --shell zsh --shell fish

  full-tests-windows:
    name: full pinned Windows tests
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025-vs2026
          - rid: win-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install Windows host prerequisites
        shell: pwsh
        run: eng/install-windows-host-prereqs.ps1
      - name: Use the Windows build drive for NuGet caches
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: eng/setup-windows-nuget-cache.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Set up verified validation SDK and runtimes
        shell: bash
        run: python eng/setup-dotnet-validation.py --rid ${{ matrix.rid }}
      - name: Restore pinned ripgrep oracle archive
        shell: pwsh
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/restore-ripgrep-oracle.ps1
      - name: Restore
        run: dotnet restore Scout.slnx
      - name: Fetch pinned corpora
        shell: bash
        run: eng/fetch-corpora.sh --all
      - name: Preflight
        shell: bash
        timeout-minutes: 30
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/preflight.sh
      - name: Test
        run: dotnet test Scout.slnx --no-restore

  performance-gate:
    name: hyperfine performance gate
    if: ${{ inputs.gate == '' || inputs.gate == 'all' || inputs.gate == 'performance' }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Record performance checkout
        id: performance-checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run performance gate
        run: bench/run-hyperfine.sh --gate
      - name: Upload hyperfine gate aggregates
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hyperfine-gate-aggregates-${{ steps.performance-checkout.outputs.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/bench/hyperfine/*.json
            artifacts/bench/hyperfine/*.samples/*.json
          if-no-files-found: warn

  native-linux-x64:
    name: release native Linux gate (linux-x64)
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: docker.io/library/debian:bookworm-slim@sha256:0104b334637a5f19aa9c983a91b54c89887c0984081f2068983107a6f6c21eeb
    steps:
      - name: Pinned snapshot apt prerequisites
        shell: sh
        run: |
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          printf 'deb %s bookworm main\n' "$LINUX_SNAPSHOT_URL" > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until false;\nAcquire::Retries 3;\n' > /etc/apt/apt.conf.d/99snapshot
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            binutils \
            bzip2 \
            brotli \
            build-essential \
            ca-certificates \
            clang \
            curl \
            fish \
            zsh \
            git \
            gzip \
            libc6="$LINUX_LIBC_VERSION" \
            libc-bin="$LINUX_LIBC_VERSION" \
            libgssapi-krb5-2 \
            libicu72 \
            libssl3 \
            lz4 \
            ncompress \
            python3 \
            tar \
            unzip \
            xz-utils \
            zlib1g \
            zlib1g-dev \
            zstd
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify Linux prerequisites
        shell: sh
        run: eng/verify-linux-prereqs.sh linux-x64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Native entry spike
        run: spike/build-unix.sh linux-x64
      - name: Native executable smoke
        run: native/build-app-unix.sh linux-x64 --smoke-only
      - name: Verify Unix shell completions
        shell: bash
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew list fish >/dev/null 2>&1 || brew install fish; fi
          python3 eng/verify-completions.py --scout artifacts/bin/linux-x64/scout --shell bash --shell zsh --shell fish

  native-linux-arm64:
    name: release native Linux gate (linux-arm64)
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install Linux host prerequisites
        shell: sh
        run: eng/install-linux-host-prereqs.sh
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Native entry spike
        run: spike/build-unix.sh linux-arm64
      - name: Native executable smoke
        run: native/build-app-unix.sh linux-arm64 --smoke-only
      - name: Verify Unix shell completions
        shell: bash
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew list fish >/dev/null 2>&1 || brew install fish; fi
          python3 eng/verify-completions.py --scout artifacts/bin/linux-arm64/scout --shell bash --shell zsh --shell fish

  native-macos:
    name: release native macOS gate
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            runner: macos-26-intel
          - rid: osx-arm64
            runner: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Native entry spike
        run: spike/build-unix.sh ${{ matrix.rid }}
      - name: Native executable smoke
        run: native/build-app-unix.sh ${{ matrix.rid }} --smoke-only
      - name: Verify Unix shell completions
        shell: bash
        run: |
          if [ "$(uname -s)" = Darwin ]; then brew list fish >/dev/null 2>&1 || brew install fish; fi
          python3 eng/verify-completions.py --scout artifacts/bin/${{ matrix.rid }}/scout --shell bash --shell zsh --shell fish

  native-windows:
    name: release native Windows gate
    if: ${{ inputs.gate == '' || inputs.gate == 'all' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025-vs2026
            vsarch: amd64
          - rid: win-arm64
            runner: windows-11-arm
            vsarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install Windows host prerequisites
        shell: pwsh
        run: eng/install-windows-host-prereqs.ps1
      - name: Use the Windows build drive for NuGet caches
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: eng/setup-windows-nuget-cache.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore pinned ripgrep oracle archive
        shell: pwsh
        env:
          SCOUT_HOST_RID: ${{ matrix.rid }}
          SCOUT_ORACLE_ENVIRONMENT: github-actions
        run: eng/restore-ripgrep-oracle.ps1
      - name: Native executable smoke
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio installation not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.vsarch }}
          pwsh -NoProfile -ExecutionPolicy Bypass -File spike/build-windows.ps1 ${{ matrix.rid }}
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File native/build-app-windows.ps1 ${{ matrix.rid }} -DifferentialMode WithDifferentials
          if errorlevel 1 exit /b 1
          python eng/verify-completions.py --scout artifacts/bin/${{ matrix.rid }}/scout.exe --shell powershell
      - name: Run complete Windows native CLI differential suite
        env:
          SCOUT_TEST_EXECUTABLE_PATH: ${{ github.workspace }}/artifacts/bin/${{ matrix.rid }}/scout.exe
        run: dotnet test tests/Scout.Differential.Tests/Scout.Differential.Tests.csproj
