version: 2
updates:
  # Directory.Build.props serializes NuGet discovery restores of shared projects.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - willibrandon
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
